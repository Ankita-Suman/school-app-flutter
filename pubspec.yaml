name: school_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Packages
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.2.3
  carousel_slider: ^4.2.1
  dotted_border: ^2.0.0
  dots_indicator: ^4.0.1
  flutter_svg: ^2.0.0+1
  flutter_cupertino_date_picker_fork: ^1.0.7
  flutter_screenutil: ^5.6.0
  flutter_otp_text_field: ^1.1.0+2
  google_fonts: ^4.0.0
  google_nav_bar: ^5.0.6
  lottie: ^2.7.0
  loading_animation_widget: ^1.2.0+4
  pinput: ^5.0.0

  # State Management & Storage
  get: ^4.6.5
  get_storage: ^2.0.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Network & APIs
  dio: ^5.1.0
  http: ^1.0.0
  url_launcher: ^6.1.7
  webview_flutter: ^4.0.2

  # Utilities
  device_info_plus: ^9.0.3
  email_validator: ^3.0.0
  intl: ^0.19.0
  logger: ^2.6.2
  uuid: ^4.5.2
  video_player: ^2.5.1

  # Navigation
  go_router: ^6.5.7

  # Internet Connection
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.3.10  # Downgraded from 2.4.0

flutter_native_splash:
  android_gravity: fill
  image: assets/images/splash.png
  fullscreen: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter Bold.ttf
          weight: 700